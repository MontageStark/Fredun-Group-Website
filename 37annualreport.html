  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
      overflow-x: hidden;
    }

    .flipbook-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      max-width: 100vw;
      overflow: hidden;
      padding: 2rem 0;
    }

    #flipbook {
      width: 90vw;
      max-width: 1600px;
      /* Allow larger sizes on big screens */
      display: flex;
      gap: 1vw;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 40vw;
      height: 60vw;
      max-width: 800px;
      max-height: 1200px;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: transparent;
      color: rgb(77, 74, 74);
      border: none;
      padding: 12px 18px;
      font-size: 24px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .nav-arrow:hover {
      background-color: rgba(137, 168, 213, 0.95);
      transform: translateY(-50%) scale(1.1);
    }

    #prevBtn {
      left: 10px;
    }

    #nextBtn {
      right: 10px;
    }

    .center-shadow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), transparent);
      z-index: 9;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* Medium and smaller devices */
    /* Responsive layout tweaks only */
    @media (max-width: 1024px) {
      .nav-arrow {
        padding: 10px 16px;
        font-size: 20px;
      }
    }

    @media (max-width: 768px) {
      .flipbook-wrapper {
        flex-direction: column;
      }

      #flipbook {
        flex-direction: column;
        width: 95vw;
      }

      .nav-arrow {
        position: static;
        transform: none;
        margin: 10px;
        padding: 10px 20px;
        font-size: 20px;
        background-color: rgba(137, 168, 213, 0.95);
        color: #fff;
        border-radius: 8px;
      }

      .mobile-nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 1rem auto 2rem;
      }

      #prevBtn,
      #nextBtn {
        left: auto;
        right: auto;
      }


    }
  </style>
</head>

  <!-- Flipbook Section -->

    <div id="flipbook"></div>

  <!-- Mobile buttons OUTSIDE flipbook wrapper -->
  <div class="mobile-nav">
    <button id="prevBtn" class="nav-arrow">❮</button>
    <button id="nextBtn" class="nav-arrow">❯</button>
  </div>



  <script>

    $(document).ready(function () {
      const flipbook = $('#flipbook');
      const flipSound = document.getElementById("flipSound");

      const totalPages = 206; // adjust to your last page

      // Loop through all pages in sequence
      for (let i = 1; i <= totalPages; i++) {
        const pageDiv = $('<div class="page"></div>');
        const img = $(`<img src="pages/page${i}.jpg" alt="Page ${i}">`);
        pageDiv.append(img);
        $('#flipbook').append(pageDiv);
      }

      // ✅ Flipbook size calculation
      function getFlipbookSize() {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        let width = Math.min(screenWidth * 0.95, 1600);
        let height = width * 0.7;

        if (height > screenHeight * 0.85) {
          height = screenHeight * 0.85;
          width = height / 0.7;
        }

        return { width, height };
      }

      // ✅ Setup Flipbook
      function setupFlipbook() {
        const { width, height } = getFlipbookSize();

        flipbook.turn({
          width: width,
          height: height,
          autoCenter: true,
          elevation: 60,
          acceleration: true,
          gradients: true,
          duration: 2000
        });

        syncPageSize();
      }

      setupFlipbook();

      $(window).on('resize', function () {
        const { width, height } = getFlipbookSize();
        flipbook.turn('size', width, height);
        syncPageSize();
      });

      // ✅ Navigation
      $('#prevBtn').click(() => {
        flipbook.turn('previous');
        flipSound.play();
      });

      $('#nextBtn').click(() => {
        flipbook.turn('next');
        flipSound.play();
      });

      $('#prevBtn, #nextBtn').on('click', () => {
        clearInterval(autoFlipInterval);
      });

      // ✅ Ensure page sizes sync
      $('.page').css({
        width: (getFlipbookSize().width / 2) + 'px',
        height: getFlipbookSize().height + 'px'
      });

      function syncPageSize() {
        const { width, height } = getFlipbookSize();
        $('.page').css({
          width: width / 2 + 'px',
          height: height + 'px'
        });
      }
    });
  </script>
  <script>
    const playButton = document.getElementById('play-audio');
    const audio = document.getElementById('company-audio');
    const icon = playButton.querySelector('i');

    playButton.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        icon.classList.remove('fa-headphones');
        icon.classList.add('fa-pause');
      } else {
        audio.pause();
        audio.currentTime = 0; // reset to beginning
        icon.classList.remove('fa-pause');
        icon.classList.add('fa-headphones');
      }
    });


  </script>
